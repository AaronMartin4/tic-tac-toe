<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Neon Tic-Tac-Toe</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <main class="game-shell">
      <header class="header">
        <div>
          <p class="eyebrow">Classic strategy game</p>
          <h1>Tic-Tac-Toe</h1>
        </div>
        <button id="reset-score" class="text-button">Reset score</button>
      </header>

      <section class="scoreboard" aria-label="Scoreboard">
        <div class="score-card x-card">
          <span class="player-symbol">X</span>
          <span class="player-label">Player X</span>
          <strong id="x-score">0</strong>
        </div>
        <div class="score-card draw-card">
          <span class="player-symbol">=</span>
          <span class="player-label">Draws</span>
          <strong id="draw-score">0</strong>
        </div>
        <div class="score-card o-card">
          <span class="player-symbol">O</span>
          <span class="player-label">Player O</span>
          <strong id="o-score">0</strong>
        </div>
      </section>

      <section class="game-card">
        <div class="status-row">
          <p id="status" aria-live="polite">Your turn — X</p>
          <span id="round-label">Round 1</span>
        </div>

        <div id="board" class="board" role="grid" aria-label="Tic-Tac-Toe board">
          <button class="cell" data-index="0" role="gridcell" aria-label="Empty cell 1"></button>
          <button class="cell" data-index="1" role="gridcell" aria-label="Empty cell 2"></button>
          <button class="cell" data-index="2" role="gridcell" aria-label="Empty cell 3"></button>
          <button class="cell" data-index="3" role="gridcell" aria-label="Empty cell 4"></button>
          <button class="cell" data-index="4" role="gridcell" aria-label="Empty cell 5"></button>
          <button class="cell" data-index="5" role="gridcell" aria-label="Empty cell 6"></button>
          <button class="cell" data-index="6" role="gridcell" aria-label="Empty cell 7"></button>
          <button class="cell" data-index="7" role="gridcell" aria-label="Empty cell 8"></button>
          <button class="cell" data-index="8" role="gridcell" aria-label="Empty cell 9"></button>
        </div>

        <button id="new-round" class="primary-button">New round</button>
      </section>
    </main>
    <script src="script.js"></script>
  </body>
</html>
